<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sanji — Mode en poste</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#7CC28F}a:hover{color:#A6D9B3}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0F1112; color: #F1F2EF; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; box-sizing: border-box; padding: 52px 20px 28px; display: flex; flex-direction: column; gap: 18px">

<header style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<a href="Fiche.dc.html" aria-label="Quitter le mode en poste" style="width: 44px; height: 44px; border-radius: 22px; background: #1A1D1F; color: #F1F2EF; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px">
<span style="font-size: 17px; font-weight: 600">Pesto · <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace">500 g</span></span>
<span style="display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: #A3A9AF"><span style="width: 6px; height: 6px; border-radius: 3px; background: #7CC28F"></span>Écran maintenu allumé</span>
</div>
<span style="width: 44px"></span>
</header>

<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{ segs }}" as="s" hint-placeholder-count="5">
<span style="{{ s.style }}"></span>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 15px; font-weight: 600; color: #A3A9AF">Étape {{ num }} sur 5</span>
<p style="margin: 0; font-size: 30px; font-weight: 600; line-height: 1.25; letter-spacing: -0.01em">{{ step.text }}</p>
</div>

<div style="background: #1A1D1F; border-radius: 18px; padding: 16px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
<span style="font-size: 20px; font-weight: 500">{{ step.ing }}</span>
<span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 28px; font-weight: 600">{{ step.qty }}</span>
</div>

<sc-if value="{{ step.timer }}" hint-placeholder-val="{{ true }}">
<div style="background: #1A1D1F; border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 48px; font-weight: 600; letter-spacing: -0.02em">[mm:ss]</span>
<button style="height: 56px; padding: 0 22px; border-radius: 14px; border: 0; background: #F1F2EF; color: #0F1112; font-size: 17px; font-weight: 700">Lancer</button>
</div>
</sc-if>

<div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button onClick="{{ prev }}" style="height: 80px; border-radius: 18px; border: 0; background: #1A1D1F; color: #F1F2EF; font-size: 20px; font-weight: 600">Précédente</button>
<sc-if value="{{ notLast }}" hint-placeholder-val="{{ true }}">
<button onClick="{{ next }}" style="height: 80px; border-radius: 18px; border: 0; background: #7CC28F; color: #0F1112; font-size: 20px; font-weight: 700">Suivante</button>
</sc-if>
<sc-if value="{{ isLast }}" hint-placeholder-val="{{ false }}">
<a href="Production.dc.html" style="height: 80px; border-radius: 18px; background: #7CC28F; color: #0F1112; font-size: 20px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Terminer</a>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { i: 1 };
}
renderVals() {
var self = this;
var steps = [
{ text: "[Étape 1 de la fiche]", ing: "[Ingrédient]", qty: "[qté]", timer: false },
{ text: "[Étape 2 de la fiche]", ing: "[Ingrédient]", qty: "[qté]", timer: true },
{ text: "[Étape 3 de la fiche]", ing: "[Ingrédient]", qty: "[qté]", timer: false },
{ text: "[Étape 4 de la fiche]", ing: "[Ingrédient]", qty: "[qté]", timer: true },
{ text: "[Étape 5 de la fiche]", ing: "[Ingrédient]", qty: "[qté]", timer: false }
];
var i = this.state.i;
var segs = steps.map(function (s, k) {
return { style: "height: 6px; border-radius: 3px; background: " + (k <= i ? "#7CC28F" : "#2A2E31") };
});
return {
segs: segs,
step: steps[i],
num: String(i + 1),
isLast: i === steps.length - 1,
notLast: i !== steps.length - 1,
prev: function () { self.setState({ i: Math.max(0, self.state.i - 1) }); },
next: function () { self.setState({ i: Math.min(steps.length - 1, self.state.i + 1) }); }
};
}
}
</script>
</body>
</html>
