<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sanji — Barre d'onglets</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Onglets" style="width: 390px; height: 84px; background: {{ bg }}; border-top: 1px solid {{ line }}; display: flex; justify-content: space-around; padding: 6px 8px 26px; box-sizing: border-box; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif">
<a href="Main.dc.html" aria-current="{{ cur.main }}" style="{{ st.main }}">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Aujourd'hui</a>
<a href="Production.dc.html" aria-current="{{ cur.production }}" style="{{ st.production }}">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 6h10M10 12h10M10 18h10"></path><path d="M4 6l1.5 1.5L8 5M4 12l1.5 1.5L8 11M4 18l1.5 1.5L8 17"></path></svg>Production</a>
<a href="Semaine.dc.html" aria-current="{{ cur.semaine }}" style="{{ st.semaine }}">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Semaine</a>
<a href="Stock.dc.html" aria-current="{{ cur.stock }}" style="{{ st.stock }}">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"></path><path d="M3 7l9 4 9-4M12 11v10"></path></svg>Stock</a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["main","production","semaine","stock"],"default":"main"},"sombre":{"editor":"boolean","default":false},"$preview":{"width":390,"height":84}}'>
class Component extends DCLogic {
renderVals() {
var active = this.props.active ?? "main";
var dark = this.props.sombre ?? false;
var on = dark ? "#7CC28F" : "#2C6A3E";
var off = dark ? "#A3A9AF" : "#5B6168";
var base = "min-width: 72px; min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 13px; text-decoration: none; ";
var keys = ["main", "production", "semaine", "stock"];
var st = {};
var cur = {};
keys.forEach(function (k) {
st[k] = base + (k === active ? "font-weight: 600; color: " + on : "font-weight: 500; color: " + off);
cur[k] = k === active ? "page" : "false";
});
return { st: st, cur: cur, bg: dark ? "#1A1D1F" : "#FFFFFF", line: dark ? "#2A2E31" : "#E2E4DF" };
}
}
</script>
</body>
</html>
