<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sanji — Semaine type</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="sanji-r2.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="ecran">
<div class="haut"><span class="surtitre">Semaine du [date]</span><h1 class="titre">Semaine</h1></div>
<div class="voile" aria-hidden="true"></div>
<section class="feuille" aria-label="Semaine type" style="top: 120px">
<div class="poignee" aria-hidden="true"></div>
<header style="display: flex; flex-direction: column; gap: 4px">
<span class="etq etq-ambre" style="align-self: flex-start"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3l10 18H2z"></path><path d="M12 10v5M12 18v.5"></path></svg>à confirmer</span>
<h2 class="titre-feuille">Semaine type</h2>
<p class="doux">Touchez un créneau pour changer son état. Rien n'est présumé, le samedi non plus.</p>
</header>
<div class="carte" style="padding: 8px 10px; gap: 0" role="table" aria-label="Créneaux">
<div role="row" style="display: grid; grid-template-columns: 44px repeat(3, minmax(0, 1fr)); gap: 6px; padding: 4px 0" class="petit doux"><span role="columnheader"></span><span role="columnheader">avant midi</span><span role="columnheader">après midi</span><span role="columnheader">avant soir</span></div>
<sc-for list="{{ rangs }}" as="r" hint-placeholder-count="6">
<div role="row" style="display: grid; grid-template-columns: 44px repeat(3, minmax(0, 1fr)); gap: 6px; padding: 4px 0; border-top: 1px solid var(--bordure); align-items: center">
<span role="rowheader" style="font-weight: 650">{{ r.j }}</span>
<sc-for list="{{ r.c }}" as="c" hint-placeholder-count="3">
<button role="cell" onClick="{{ c.tour }}" aria-label="{{ c.aria }}" style="{{ c.style }}">{{ c.t }}</button>
</sc-for>
</div>
</sc-for>
<div role="row" style="display: grid; grid-template-columns: 44px 1fr; gap: 6px; padding: 8px 0 4px; border-top: 1px solid var(--bordure)"><span style="font-weight: 650">Dim</span><span class="doux">fermé, sans tâche ; compté dans la règle des 2 jours</span></div>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
<button class="btn btn-decision btn-large">Confirmer la semaine type</button>
<a class="btn btn-large" href="C1-Semaine.dc.html">Plus tard</a>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { s: { "5-0": 3, "5-1": 3, "5-2": 3 } }; }
renderVals() {
var self = this;
var noms = ["libre", "chargé", "indispo.", "à confirmer"];
var look = ["background: var(--carte); color: var(--texte); border: 1px solid var(--bordure)", "background: var(--exception-fond); color: var(--exception); border: 1px solid var(--exception-bord)", "background: var(--carte-2); color: var(--texte-doux); border: 1px dashed var(--bordure-forte)", "background: var(--carte); color: var(--exception); border: 1.5px dashed var(--exception-bord)"];
var cr = ["avant midi", "après midi", "avant soir"];
var rangs = ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam"].map(function (j, d) {
return { j: j, c: cr.map(function (nom, k) {
var cle = d + "-" + k;
var existe = !(k === 2 && d < 2);
var v = existe ? (self.state.s[cle] === undefined ? 0 : self.state.s[cle]) : -1;
return {
t: existe ? noms[v] : "—", aria: j + ", " + nom + " : " + (existe ? noms[v] : "pas de créneau"),
style: "min-height: 44px; border-radius: 8px; font: inherit; font-size: 13px; font-weight: 600; padding: 0 2px; " + (existe ? look[v] : "background: transparent; color: var(--texte-doux); border: 0"),
tour: function () { if (!existe) return; var s = Object.assign({}, self.state.s); s[cle] = ((s[cle] === undefined ? 0 : s[cle]) + 1) % 3; self.setState({ s: s }); }
};
}) };
});
return { rangs: rangs };
}
}
</script>
</body>
</html>
