<script type="text/x-dc" data-dc-script data-props='{"actif":{"editor":"enum","options":["aujourdhui","production","semaine","stock"],"default":"aujourdhui"},"sombre":{"editor":"boolean","default":false},"$preview":{"width":390,"height":84}}'>
class Component extends DCLogic {
renderVals() {
var a = this.props.actif ?? "aujourdhui";
var cur = {};
["aujourdhui", "production", "semaine", "stock"].forEach(function (k) { cur[k] = k === a ? "page" : "false"; });
return { cur: cur, classe: (this.props.sombre ?? false) ? "planche sombre" : "planche" };
}
}
</script>
